<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Opening Google Store | Lumivox</title>
  <style>
    :root { color-scheme: dark; --ink:#f5f7ff; --muted:#b3b9e6; --line:rgba(123,92,255,.25); --bg:linear-gradient(160deg,#0a0e1a,#121838 45%,#1a1640 75%,#2a1438); --card:rgba(255,255,255,.06); --cta:linear-gradient(90deg,#2d6bff,#7b5cff,#ff5c8a); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width:min(92vw, 560px); background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px; box-shadow:0 24px 80px rgba(0,0,0,.28),0 0 30px rgba(123,92,255,.18); text-align:center; backdrop-filter:blur(18px); }
    .pill { display:inline-block; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:#c9ceff; margin-bottom:12px; }
    h1 { font-size:clamp(28px, 5vw, 40px); margin:0 0 12px; }
    p { color:var(--muted); line-height:1.6; margin:0 0 20px; }
    a.button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 20px; border-radius:999px; background:var(--cta); color:#fff; text-decoration:none; font-weight:700; box-shadow:0 0 24px rgba(123,92,255,.28); }
    a.button:focus-visible { outline:3px solid rgba(92,208,255,.85); outline-offset:4px; }
    .small { font-size:13px; margin-top:18px; }
  </style>
</head>
<body>
  <main>
    <span class="pill">Lumivox product path</span>
    <h1>Opening Google Store</h1>
    <p>You are being redirected to the Fitbit Inspire 3 page on Google Store. Availability varies by country.</p>
    <a class="button" id="continue-link" href="https://store.google.com/product/fitbit_inspire_3?hl=en-US" rel="sponsored nofollow noopener">Continue to Google Store</a>
    <p class="small">If this retailer does not serve your region, return to the Lumivox sleep tracker options page.</p>
  </main>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"b942e39c3ad64cacb2e4cc13e9fcd9ae"}'></script>
  <script>
    window.setTimeout(function () {
      window.location.href = document.getElementById('continue-link').href;
    }, 1200);
  </script>
</body>
</html>
